l_english:
 annexation_decisions:0 "Occupation Decisions"
 annexation_decisions_desc:0 "Decide the political future of countries and territories now under our control."
 annexation_release_as_puppet:0 "Establish a loyal government under our protection."
 annexation_continue_occupation:0 "Continue the military occupation."
 return_cores_to_ally:0 "Return cores to ally"
 return_cores_to_ally_desc:0 "Be a friend!"

 kr.political.75.t:0 "Returning Land"
 kr.political.75.d:0 "Since they are our allies, we should probably do this, right?"
 kr.political.75.a:0 "Give it all back."
 kr.political.75.b:0 "Only give the cores."
 kr.political.75.c:0 "Only give the cores."
 kr.political.75.e:0 "Keep it all."
 kr.political.76.t:0 "Ally has returned land."
 kr.political.76.d:0 "How nice of them, you think?"
 kr.political.76.a:0 "Certainly."
 annexation_USA_CONQ:0 "The Fate of the United States of America"
 annexation_USA_CONQ_desc:0 "With the United States of America under our control, we must decide how its territory will be administered. We can restore a loyal local government under our protection or continue the occupation directly."
