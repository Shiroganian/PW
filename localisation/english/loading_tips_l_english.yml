l_english:
 LOADING_TIP_0:0 "There is such a thing as a man being too proud to fight.\n- Thomas Woodrow Wilson"
 LOADING_TIP_1:0 "The world must be made safe for democracy.\n- Thomas Woodrow Wilson"
 LOADING_TIP_2:0 "We have no selfish ends to serve.\n- Thomas Woodrow Wilson"
 LOADING_TIP_3:0 "We desire no conquest, no dominion.\n- Thomas Woodrow Wilson"
 LOADING_TIP_4:0 "We stand together until the end.\n- Thomas Woodrow Wilson"

 LOADING_TIP_5:0 "I'm for the poor man — all poor men, black and white, they all gotta have a chance.\n- Huey Pierce Long Jr."
 LOADING_TIP_6:0 "They gotta have a home, a job, and a decent education for their children. 'Every Man A King' — that's my slogan.\n- Huey Pierce Long Jr."
 LOADING_TIP_7:0 "A man is not a dictator when he is given a commission from the people and carries it out.\n- Huey Pierce Long Jr."
 LOADING_TIP_8:0 "All I care is what the boys at the forks of the creek think of me.\n- Huey Pierce Long Jr."
 LOADING_TIP_9:0 "Only I know that laws ain't made that way. You've got to fight fire with fire.\n- Huey Pierce Long Jr."

 LOADING_TIP_10:0 "The Nation has spoken.\n- Alfred Mossman Landon"
 LOADING_TIP_11:0 "That is the spirit of democracy.\n- Alfred Mossman Landon"
 LOADING_TIP_12:0 "You have my sincere congratulations.\n- Alfred Mossman Landon"
 LOADING_TIP_13:0 "It carries with it both an honor and a responsibility.\n- Alfred Mossman Landon"
 LOADING_TIP_14:0 "In a republic these cannot be separated.\n- Alfred Mossman Landon"

 LOADING_TIP_15:0 "I believe that a great work of peace has been done.\n- Joseph Austen Chamberlain"
 LOADING_TIP_16:0 "None of the Allies sought war.\n- Joseph Austen Chamberlain"
 LOADING_TIP_17:0 "None of the Allies dreamed of making aggressive war.\n- Joseph Austen Chamberlain"
 LOADING_TIP_18:0 "Gentlemen do not behave in such a way.\n- Joseph Austen Chamberlain"
 LOADING_TIP_19:0 "I do not think that I said that.\n- Joseph Austen Chamberlain"

 LOADING_TIP_20:0 "The War interrupted the sound political evolution of Russia.\n- Alexander Fyodorovich Kerensky"
 LOADING_TIP_21:0 "The Bolshevist reaction, born of the blood and horrors of war, threw Russia back a century.\n- Alexander Fyodorovich Kerensky"
 LOADING_TIP_22:0 "It was an extraordinary time, an inspired time, a time of bold daring and great suffering.\n- Alexander Fyodorovich Kerensky"
 LOADING_TIP_23:0 "It was a time unique in the pages of history.\n- Alexander Fyodorovich Kerensky"
 LOADING_TIP_24:0 "The power and authority of the officers disappeared.\n- Alexander Fyodorovich Kerensky"

 LOADING_TIP_25:0 "I am Polish, therefore I have Polish obligations.\n- Roman Stanisław Dmowski"
 LOADING_TIP_26:0 "In relations with other nations, there is neither right nor wrong; there is only strength and weakness.\n- Roman Stanisław Dmowski"
 LOADING_TIP_27:0 "Everything that is Polish is mine.\n- Roman Stanisław Dmowski"
 LOADING_TIP_28:0 "The only salvation for us is to stop being an incoherent, loose mob and to change into a strongly organized, disciplined army.\n- Roman Stanisław Dmowski"
 LOADING_TIP_29:0 "Everyone is responsible for the course of these matters.\n- Roman Stanisław Dmowski"

 LOADING_TIP_30:0 "The second of the newly discovered methods is the right of recall.\n- Sun Yat-sen"
 LOADING_TIP_31:0 "This third kind of popular power is called the initiative.\n- Sun Yat-sen"
 LOADING_TIP_32:0 "At the moment, the Revolution has not yet succeeded.\n- Sun Yat-sen"
 LOADING_TIP_33:0 "This is my heartfelt charge to you.\n- Sun Yat-sen"
 LOADING_TIP_34:0 "Following China's war with France I made up my mind to devote myself to the revolution.\n- Sun Yat-sen"

 LOADING_TIP_35:0 "My loyalty to my party ends where my loyalty to my country begins.\n- Manuel Luis Quezon"
 LOADING_TIP_36:0 "I did not look for the conflict.\n- Manuel Luis Quezon"
 LOADING_TIP_37:0 "There is an impression that Davao is actually owned by the Japanese.\n- Manuel Luis Quezon"
 LOADING_TIP_38:0 "Such is not the case.\n- Manuel Luis Quezon"
 LOADING_TIP_39:0 "The Army is a double-edged sword.\n- Manuel Luis Quezon"

 LOADING_TIP_40:0 "To-day, we Australians are faced with a war for survival.\n- John Joseph Curtin"
 LOADING_TIP_41:0 "The enemy thunders at our very gates.\n- John Joseph Curtin"
 LOADING_TIP_42:0 "Men and women of Australia, we are at war with Japan.\n- John Joseph Curtin"
 LOADING_TIP_43:0 "I speak to you from Australia.\n- John Joseph Curtin"
 LOADING_TIP_44:0 "I am not speaking to your Government.\n- John Joseph Curtin"

 LOADING_TIP_45:0 "Now then ladies and gentlemen, we have no desire to raise ourselves at your expense.\n- Michael Joseph Savage"
 LOADING_TIP_46:0 "Thank you ladies and gentlemen.\n- Michael Joseph Savage"
 LOADING_TIP_47:0 "Where she goes, we go.\n- Michael Joseph Savage"
 LOADING_TIP_48:0 "Where she stands, we stand.\n- Michael Joseph Savage"
 LOADING_TIP_49:0 "Good afternoon everybody.\n- Michael Joseph Savage"

 LOADING_TIP_50:0 "Scientific history becomes confused and leaves unanswered all these ruminations.\n- José Vasconcelos Calderón"
 LOADING_TIP_51:0 "Precisely there, where the analyst discovers nothing, the synthesizer and the creator are enlightened.\n- José Vasconcelos Calderón"
 LOADING_TIP_52:0 "The white, the red, the black and the yellow, America is home to all of them and needs all of them.\n- José Vasconcelos Calderón"
 LOADING_TIP_53:0 "It is clear that domination by the whites will also be temporary, but their mission is to serve as a bridge.\n- José Vasconcelos Calderón"
 LOADING_TIP_54:0 "This love will be one of the fundamental dogmas of the fifth race that will arise in America.\n- José Vasconcelos Calderón"

 LOADING_TIP_55:0 "We have resolved to endure the unendurable and suffer what is unsufferable.\n- Emperor Hirohito"
 LOADING_TIP_56:0 "The hardships and sufferings to which our nation is to be subjected hereafter will certainly be great.\n- Emperor Hirohito"
 LOADING_TIP_57:0 "Unite your total strength, to be devoted to construction for the future.\n- Emperor Hirohito"
 LOADING_TIP_58:0 "We are keenly aware of the inmost feelings of all of you, our subjects.\n- Emperor Hirohito"
 LOADING_TIP_59:0 "From today hereafter, the Empire will endure excruciating hardships.\n- Emperor Hirohito"

 LOADING_TIP_60:0 "It is collective security.\n- Haile Selassie I"
 LOADING_TIP_61:0 "It is the very existence of the League of Nations.\n- Haile Selassie I"
 LOADING_TIP_62:0 "Is it the Covenant that needs reform?\n- Haile Selassie I"
 LOADING_TIP_63:0 "These fearful tactics succeeded.\n- Haile Selassie I"
 LOADING_TIP_64:0 "God and history will remember your judgment.\n- Haile Selassie I"

 LOADING_TIP_65:0 "What arrant nonsense!\n- Jan Christiaan Smuts"
 LOADING_TIP_66:0 "We do not pretend in South Africa to listen to these siren voices.\n- Jan Christiaan Smuts"
 LOADING_TIP_67:0 "Holism is therefore a viewpoint additional and complementary to that of science, whose keywords are continuity and mechanism.\n- Jan Christiaan Smuts"
 LOADING_TIP_68:0 "That is the essence of a whole.\n- Jan Christiaan Smuts"
 LOADING_TIP_69:0 "The fight for human freedom is indeed the supreme issue of the future, as it has always been.\n- Jan Christiaan Smuts"

 LOADING_TIP_70:0 "Hindutva is not a word but a history.\n- Vinayak Damodar Savarkar"
 LOADING_TIP_71:0 "Hinduism is only a derivative, a fraction, a part of Hindutva.\n- Vinayak Damodar Savarkar"
 LOADING_TIP_72:0 "Hindutva embraces all the departments of thought and activity of the whole Being or our Hindu race.\n- Vinayak Damodar Savarkar"
 LOADING_TIP_73:0 "These are the essentials of Hindutva—a common nation (Rashtra) a common race (Jati) and a common civilization (Sanskriti).\n- Vinayak Damodar Savarkar"
 LOADING_TIP_74:0 "Hinduism is a word that properly speaking should be applied to all the religious beliefs that the different communities of the Hindu people hold.\n- Vinayak Damodar Savarkar"

 LOADING_TIP_75:0 "The old country must wake up if she intends to maintain her old position of pre-eminence in her colonial trade against foreign competitors.\n- George V"
 LOADING_TIP_76:0 "I may be uninspiring, but I'll be damned if I'm alien.\n- George V"
 LOADING_TIP_77:0 "Together we are fighting for the greatest cause for which peoples could fight.\n- George V"
 LOADING_TIP_78:0 "We have to create a better Britain and bestow more care on the health and well-being of the people.\n- George V"
 LOADING_TIP_79:0 "For centuries past Britain has led the world along the path of ordered freedom.\n- George V"

 LOADING_TIP_80:0 "I will not sheathe my sword until Finland and East Karelia are free.\n- Carl Gustaf Emanuel Mannerheim"
 LOADING_TIP_81:0 "Trust in the commander is the first condition for success.\n- Carl Gustaf Emanuel Mannerheim"
 LOADING_TIP_82:0 "We are fighting for home, religion, and the Fatherland.\n- Carl Gustaf Emanuel Mannerheim"
 LOADING_TIP_83:0 "Forts, cannons and foreign aid will not help unless every man himself knows that he is the guard of his country.\n- Carl Gustaf Emanuel Mannerheim"
 LOADING_TIP_84:0 "You know me and I know you, and I know that each of you is ready to fulfill your duty until death.\n- Carl Gustaf Emanuel Mannerheim"

 LOADING_TIP_85:0 "I have returned to the government on the arms of the people.\n- Getulio Vargas"
 LOADING_TIP_86:0 "Nothing more can I give you except my blood.\n- Getulio Vargas"
 LOADING_TIP_87:0 "The people whose slave I was will no longer be slaves to anyone.\n- Getulio Vargas"
 LOADING_TIP_88:0 "I have fought month after month, day after day, hour after hour, resisting constant, unceasing pressure.\n- Getulio Vargas"
 LOADING_TIP_89:0 "Serenely, I take my first step on the road to eternity and leave life to enter history.\n- Getulio Vargas"

 LOADING_TIP_90:0 "Everything for the nation, nothing against the nation.\n- Antonio de Oliveira Salazar"
 LOADING_TIP_91:0 "God, Fatherland, and Family.\n- Antonio de Oliveira Salazar"
 LOADING_TIP_92:0 "To Angola, quickly and with strength.\n- Antonio de Oliveira Salazar"
 LOADING_TIP_93:0 "Proudly alone.\n- Antonio de Oliveira Salazar"
 LOADING_TIP_94:0 "I have the grace of providence to be poor.\n- Antonio de Oliveira Salazar"

 LOADING_TIP_95:0 "A party should be founded not merely on numbers, but on moral principles.\n- Eleftherios Venizelos"
 LOADING_TIP_96:0 "Neutrality is not politics.\n- Eleftherios Venizelos"
 LOADING_TIP_97:0 "Greece expects you not merely to die for her; she expects you to conquer.\n- Eleftherios Venizelos"
 LOADING_TIP_98:0 "One cannot kick against geography.\n- Eleftherios Venizelos"
 LOADING_TIP_99:0 "I had to decide whether I would be a lawyer by profession and a revolutionary at intervals, or a revolutionary by profession and a lawyer at intervals.\n- Eleftherios Venizelos"

 LOADING_TIP_100:0 "Nigeria is not a nation. It is a mere geographical expression.\n- Obafemi Awolowo"
 LOADING_TIP_101:0 "After rain comes sunshine, and after darkness comes the glorious dawn.\n- Obafemi Awolowo"
 LOADING_TIP_102:0 "The yearning for independence is a natural instinct embedded in the breast of man by nature.\n- Obafemi Awolowo"
 LOADING_TIP_103:0 "We must never lose sight of the fact that the attainment of independence is not an end in itself.\n- Obafemi Awolowo"
 LOADING_TIP_104:0 "There can be no alternative to a democratic way of life if the aim of government is the welfare of the people.\n- Obafemi Awolowo"

 LOADING_TIP_105:0 "It is natural that I should bear entire responsibility for the war in general, and I am prepared to do so.\n- Hideki Tojo"
 LOADING_TIP_106:0 "It is my intention to speak frankly, according to my recollection.\n- Hideki Tojo"
 LOADING_TIP_107:0 "What is true is true, and what is false is false.\n- Hideki Tojo"
 LOADING_TIP_108:0 "To shade one's words in flattery to the point of untruthfulness would falsify the trial.\n- Hideki Tojo"
 LOADING_TIP_109:0 "That the Pearl Harbor attack should have succeeded in achieving surprise seems a blessing from Heaven.\n- Hideki Tojo"

 LOADING_TIP_110:0 "Spain is a unit of destiny in the universal.\n- Jose Antonio Primo de Rivera"
 LOADING_TIP_111:0 "The Falange is not a way of thinking; it is a way of being.\n- Jose Antonio Primo de Rivera"
 LOADING_TIP_112:0 "Life is not a firework to be let off at the end of a party.\n- Jose Antonio Primo de Rivera"
 LOADING_TIP_113:0 "Fascism was born to inspire a collective, integral, national faith.\n- Jose Antonio Primo de Rivera"
 LOADING_TIP_114:0 "We want Spain resolutely to recover the universal meaning of her culture and history.\n- Jose Antonio Primo de Rivera"

 LOADING_TIP_115:0 "You should not be serving me. I should be serving you.\n- Puyi"
 LOADING_TIP_116:0 "I covered up my crimes in order to protect myself.\n- Puyi"
 LOADING_TIP_117:0 "I maintained that I had not betrayed my country but had been kidnapped.\n- Puyi"
 LOADING_TIP_118:0 "I withheld some of what I knew to protect myself from being punished by my country.\n- Puyi"
 LOADING_TIP_119:0 "I said nothing about my secret collaboration with the Japanese imperialists over a long period.\n- Puyi"

 LOADING_TIP_120:0 "We Arabs, especially the educated among us, look with the deepest sympathy on the Zionist movement.\n- Faisal I"
 LOADING_TIP_121:0 "We will wish the Jews a most hearty welcome home.\n- Faisal I"
 LOADING_TIP_122:0 "Iraq is a kingdom ruled by a Sunni Arab government founded on the wreckage of Ottoman rule.\n- Faisal I"
 LOADING_TIP_123:0 "There is still no Iraqi people, but unimaginable masses of human beings devoid of any patriotic idea.\n- Faisal I"
 LOADING_TIP_124:0 "The two main branches of the Semitic family understand one another.\n- Faisal I"

 LOADING_TIP_125:0 "For Fascism, the State and the individual are one.\n- Giovanni Gentile"
 LOADING_TIP_126:0 "Fascist thought attained maturity through the influence of contemporary Italian idealism.\n- Giovanni Gentile"
 LOADING_TIP_127:0 "The authority of the State was not a product, but a presupposition.\n- Giovanni Gentile"
 LOADING_TIP_128:0 "The authority of the State is not subject to negotiation or compromise.\n- Giovanni Gentile"
 LOADING_TIP_129:0 "The merit of Fascism was that it courageously and vigorously opposed itself to the prejudices of contemporary liberalism.\n- Giovanni Gentile"

 LOADING_TIP_130:0 "Every man a king, but no one wears a crown.\n- Huey P. Long Jr."
 LOADING_TIP_131:0 "My voice will be the same as it has been. Patronage will not change it. Fear will not change it. Persecution will not change it.\n- Huey P. Long Jr."
 LOADING_TIP_132:0 "I am for the poor man—all poor men, black and white; they all have to have a chance.\n- Huey P. Long Jr."
 LOADING_TIP_133:0 "Whenever this administration has gone to the left I have voted for it, and whenever it has gone to the right I have voted against it.\n- Huey P. Long Jr."
 LOADING_TIP_134:0 "There has never been a country that put its heel down on the Jews that ever lived afterwards.\n- Huey P. Long Jr."

 LOADING_TIP_135:0 "In the construction of a country, it is not the practical workers but the idealists and planners that are difficult to find.\n- Sun Yat-sen"
 LOADING_TIP_136:0 "The first is the period of military government; the second, political tutelage; and the third, constitutional government.\n- Sun Yat-sen"
 LOADING_TIP_137:0 "The Chinese people have only family and clan solidarity; they do not have national spirit.\n- Sun Yat-sen"
 LOADING_TIP_138:0 "China is now suffering from poverty, not from unequal distribution of wealth.\n- Sun Yat-sen"
 LOADING_TIP_139:0 "An individual should not have too much freedom, but a nation should have absolute freedom.\n- Sun Yat-sen"

 LOADING_TIP_140:0 "Throughout history, it has been the inaction of those who could have acted that has made it possible for evil to triumph.\n- Haile Selassie I"
 LOADING_TIP_141:0 "Peace is a day-to-day problem, the product of a multitude of events and judgments.\n- Haile Selassie I"
 LOADING_TIP_142:0 "Leadership does not mean domination. The world is always well supplied with people who wish to rule and dominate others.\n- Haile Selassie I"
 LOADING_TIP_143:0 "We must become something we have never been and for which our education and experience have ill-prepared us.\n- Haile Selassie I"
 LOADING_TIP_144:0 "Until the philosophy which holds one race superior and another inferior is finally and permanently discredited and abandoned, everywhere is war.\n- Haile Selassie I"

 LOADING_TIP_145:0 "The ties between us and our people have always stood upon mutual trust and affection.\n- Hirohito"
 LOADING_TIP_146:0 "We stand by the people, and we wish always to share with them in their moments of joys and sorrows.\n- Hirohito"
 LOADING_TIP_147:0 "We desire to occupy an honored place in an international society striving for the preservation of peace.\n- Hirohito"
 LOADING_TIP_148:0 "Let the entire nation continue as one family from generation to generation.\n- Hirohito"
 LOADING_TIP_149:0 "Cultivate the ways of concord and mutual help.\n- Hirohito"