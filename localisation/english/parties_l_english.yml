l_english:
 # Pax Wilsoniana subideologies
 jacobinism:0 "Jacobinism"
 jacobinism_desc:0 "A centralized revolutionary doctrine seeking a rigorously egalitarian social order through a commanding state and uncompromising political authority."
 left_wing_military_junta:0 "Left-Wing Military Junta"
 left_wing_military_junta_desc:0 "A socialist military regime in which revolutionary officers direct the state, economy, and security apparatus."
 national_communism:0 "National Communism"
 national_communism_desc:0 "A centralized communist doctrine combining command economics with national liberation, political discipline, and a powerful security state."

 left_wing_nationalism:0 "Left-Wing Nationalism"
 left_wing_nationalism_desc:0 "A party-led socialist doctrine linking national liberation and unity to state-directed economic transformation."
 market_socialism:0 "Market Socialism"
 market_socialism_desc:0 "A socialist system retaining regulated markets while placing strategic industries and political authority under collective or state control."
 marxism_leninism:0 "Marxism-Leninism"
 marxism_leninism_desc:0 "A vanguard-party doctrine pursuing socialism through centralized political leadership, planned development, and adherence to Marxist theory."

 democratic_socialism:0 "Democratic Socialism"
 democratic_socialism_desc:0 "A socialist doctrine pursuing economic equality and social ownership through representative institutions, civil liberties, and a popular mandate."
 anarcho_communism:0 "Anarcho-Communism"
 anarcho_communism_desc:0 "A decentralist communist doctrine seeking stateless self-government, common ownership, voluntary association, and mutual aid."
 popular_front_socialism:0 "Popular Front Socialism"
 popular_front_socialism_desc:0 "A broad democratic socialist coalition doctrine emphasizing anti-fascist cooperation, labor rights, reform, and constitutional government."
 social_corporatism:0 "Social Corporatism"
 social_corporatism_desc:0 "A socialist doctrine organizing labor, industry, and professional bodies into representative institutions under a democratic state."

 left_centrism:0 "Left-Centrism"
 left_centrism_desc:0 "A reformist center-left doctrine combining democratic institutions, civil liberties, negotiated change, and egalitarian social policy."
 left_wing_populism:0 "Left-Wing Populism"
 left_wing_populism_desc:0 "A democratic reform doctrine mobilizing popular support against entrenched elites in favor of redistribution and expansive social programs."
 progressivism:0 "Progressivism"
 progressivism_desc:0 "A democratic reform doctrine emphasizing accountable institutions, civil liberties, social welfare, and gradual economic modernization."
 longism:0 "Longism"
 longism_desc:0 "A populist social-democratic doctrine centered on economic redistribution, energetic executive government, and a direct appeal to the electorate."
 weimar_socialism:0 "Weimar Socialism"
 weimar_socialism_desc:0 "A republican social-democratic doctrine defending parliamentary government, organized labor, social reform, and militant constitutionalism."
 orthodox_tridemism:0 "Orthodox Tridemism"
 orthodox_tridemism_desc:0 "An orthodox interpretation of the Three Principles combining nationalism, democratic government, and social welfare in a modernizing republic."

 centrism:0 "Centrism"
 centrism_desc:0 "An institutional liberal doctrine favoring practical compromise, technocratic administration, cautious reform, and political stability."
 green_liberalism:0 "Green Liberalism"
 green_liberalism_desc:0 "A liberal doctrine combining civil rights and representative government with conservation, stewardship, and sustainable development."
 wilsonianism:0 "Wilsonianism"
 wilsonianism_desc:0 "A liberal internationalist doctrine emphasizing constitutional government, collective security, diplomacy, and a rules-based international order."
 state_liberalism:0 "State Liberalism"
 state_liberalism_desc:0 "A liberal doctrine using a capable central state to protect institutions, regulate economic development, and advance measured social reform."
 progressive_liberalism:0 "Progressive Liberalism"
 progressive_liberalism_desc:0 "A reformist liberal doctrine combining parliamentary government and civil liberties with social policy and regulated economic modernization."
 liberal_socialism:0 "Liberal Socialism"
 liberal_socialism_desc:0 "A liberal doctrine pairing democratic institutions and civil rights with social ownership, welfare provision, and economic reform."
 christian_democracy:0 "Christian Democracy"
 christian_democracy_desc:0 "A democratic doctrine combining constitutional government, social responsibility, religious ethics, and a regulated market economy."
 liberal_czechoslovakism:0 "Liberal Czechoslovakism"
 liberal_czechoslovakism_desc:0 "A civic liberal doctrine defending Czechoslovak unity through parliamentary institutions, pluralism, and gradual modernization."
 center_tridemism:0 "Center Tridemism"
 center_tridemism_desc:0 "A moderate interpretation of the Three Principles emphasizing national unity, representative government, and pragmatic modernization."
 oriental_wilsonianism:0 "Oriental Wilsonianism"
 oriental_wilsonianism_desc:0 "A constitutional modernizing doctrine adapting liberal internationalism, collective security, and national self-determination to Asian conditions."
 habsburg_liberalism:0 "Habsburg Liberalism"
 habsburg_liberalism_desc:0 "A constitutional monarchist doctrine joining dynastic federalism with civil liberties, parliamentary reform, and multinational accommodation."
 humanistic_capitalism:0 "Humanistic Capitalism"
 humanistic_capitalism_desc:0 "A liberal doctrine supporting private enterprise while emphasizing human welfare, civic responsibility, and inclusive national development."

 classical_liberalism:0 "Classical Liberalism"
 classical_liberalism_desc:0 "A market liberal doctrine emphasizing private property, free exchange, limited government, individual liberty, and constitutional rule."
 national_liberalism:0 "National Liberalism"
 national_liberalism_desc:0 "A market liberal doctrine combining commercial freedom and constitutional government with national unity and state-led modernization."
 right_libertarianism:0 "Right Libertarianism"
 right_libertarianism_desc:0 "A market liberal doctrine advocating strong property rights, extensive economic freedom, decentralization, and a tightly limited state."
 league_mandate_socdem:0 "League Mandate"
 league_mandate_socdem_desc:0 "A technocratic international administration established to preserve neutral governance, commerce, and collective security in a strategic territory."
 league_mandate_soclib:0 "League Mandate"
 league_mandate_soclib_desc:0 "A technocratic international administration established to preserve neutral governance, commerce, and collective security in a strategic territory."
 league_mandate_marlib:0 "League Mandate"
 league_mandate_marlib_desc:0 "A technocratic international administration established to preserve neutral governance, commerce, and collective security in a strategic territory."
 league_mandate_soccon:0 "League Mandate"
 league_mandate_soccon_desc:0 "A technocratic international administration established to preserve neutral governance, commerce, and collective security in a strategic territory."

 christian_conservatism:0 "Christian Conservatism"
 christian_conservatism_desc:0 "A democratic conservative doctrine grounding social order, gradual reform, and public responsibility in Christian political ethics."
 classical_conservatism:0 "Classical Conservatism"
 classical_conservatism_desc:0 "A democratic conservative doctrine defending established institutions, social continuity, local liberties, and cautious reform."
 national_conservatism:0 "National Conservatism"
 national_conservatism_desc:0 "A democratic conservative doctrine emphasizing national cohesion, traditional institutions, ordered liberty, and sovereign government."
 southern_conservatism:0 "Southern Conservatism"
 southern_conservatism_desc:0 "An American conservative doctrine emphasizing states' rights, local authority, traditional social institutions, and restrained federal power."
 american_nationalism:0 "American Nationalism"
 american_nationalism_desc:0 "An American conservative doctrine emphasizing national sovereignty, constitutional institutions, domestic strength, and guarded international engagement."
 paternalistic_conservatism:0 "Paternalistic Conservatism"
 paternalistic_conservatism_desc:0 "A conservative doctrine defending hierarchy and tradition while accepting limited social reform and protective state intervention."
 arab_nationalism:0 "Arab Nationalism"
 arab_nationalism_desc:0 "A conservative nationalist doctrine seeking political solidarity, sovereignty, and cultural unity among Arab communities."

 anocracy:0 "Anocracy"
 anocracy_desc:0 "A hybrid regime combining limited representative institutions with unelected authority, restricted liberties, and unstable political competition."
 corporatocracy:0 "Corporatocracy"
 corporatocracy_desc:0 "An authoritarian system in which organized economic interests exercise decisive influence over political institutions and state policy."
 oligarchy:0 "Oligarchy"
 oligarchy_desc:0 "An authoritarian system in which political and economic power is concentrated in a narrow, unelected elite."
 oligarchism:0 "Oligarchism"
 oligarchism_desc:0 "A doctrine legitimizing rule by a restricted group of political, military, landed, or commercial elites."
 clerical_nationalism:0 "Clerical Nationalism"
 clerical_nationalism_desc:0 "An authoritarian doctrine fusing national political authority with clerical influence, religious identity, and conservative social order."
 imperial_bonapartism:0 "Imperial Bonapartism"
 imperial_bonapartism_desc:0 "A plebiscitary authoritarian doctrine centered on a powerful executive, national glory, administrative centralization, and imperial restoration."
 right_tridemism:0 "Right Tridemism"
 right_tridemism_desc:0 "An authoritarian interpretation of the Three Principles prioritizing national unity, political tutelage, military strength, and centralized modernization."
 oriental_synthesis:0 "Oriental Synthesis"
 oriental_synthesis_desc:0 "A hybrid authoritarian doctrine combining local political traditions with limited representation, technocratic administration, and centralized order."
 ethnic_oligarchism:0 "Ethnic Oligarchism"
 ethnic_oligarchism_desc:0 "A decentralized authoritarian system in which ethnic, tribal, and regional elites share political power through restricted institutions."
 decentralized_oligarchism:0 "Decentralized Oligarchism"
 decentralized_oligarchism_desc:0 "An authoritarian arrangement granting extensive local autonomy while national authority remains in the hands of a narrow elite."
 transitional_government:0 "Transitional Government"
 transitional_government_desc:0 "An emergency authoritarian administration claiming temporary powers to restore order, preserve the state, or conclude an internal conflict."
 oligarchic_monarchism:0 "Oligarchic Monarchism"
 oligarchic_monarchism_desc:0 "A monarchical doctrine in which the sovereign governs through bargains with powerful dynastic, tribal, religious, and commercial elites."
 solomonic_pan_africanism:0 "Solomonic Pan-Africanism"
 solomonic_pan_africanism_desc:0 "An Ethiopian imperial doctrine combining Solomonic legitimacy, centralized modernization, and a wider commitment to African sovereignty."
 euro_african_synthesis:0 "Euro-African Synthesis"
 euro_african_synthesis_desc:0 "A hybrid authoritarian doctrine joining European administrative institutions with African political participation and local power structures."

 absolute_monarchy:0 "Absolute Monarchy"
 absolute_monarchy_desc:0 "A despotic doctrine vesting sovereign authority in a hereditary monarch with few or no binding constitutional restraints."
 radical_nationalism:0 "Radical Nationalism"
 radical_nationalism_desc:0 "A despotic doctrine demanding national unity, centralized authority, militarized civic life, and strict social conformity."
 military_junta:0 "Military Junta"
 military_junta_desc:0 "A despotic regime governed directly by senior military officers who suspend civilian politics in the name of order and security."

 classical_fascism:0 "Classical Fascism"
 classical_fascism_desc:0 "A revolutionary nationalist doctrine seeking a one-party state, corporatist economy, militarized society, and expansionist national rebirth."
 clerical_fascism:0 "Clerical Fascism"
 clerical_fascism_desc:0 "A fascist doctrine combining totalitarian nationalism and corporatism with militant religious authority and enforced social hierarchy."
 ultranationalism:0 "Ultranationalism"
 ultranationalism_desc:0 "A fascist doctrine placing the nation above individual liberty and pursuing total political mobilization, militarism, and national expansion."
 revolutionary_ultranationalism:0 "Revolutionary Ultranationalism"
 revolutionary_ultranationalism_desc:0 "A fascist doctrine seeking to destroy the existing order and replace it with a mobilized, expansionist, and culturally totalitarian national state."
 imperial_fascism:0 "Imperial Fascism"
 imperial_fascism_desc:0 "A fascist doctrine combining extreme royalism, militarized corporatism, and the restoration or expansion of imperial power."
 falangism:0 "Falangism"
 falangism_desc:0 "A fascist doctrine advocating national syndicalism, centralized authority, cultural unity, and militant social discipline."
 hindutva:0 "Hindutva"
 hindutva_desc:0 "A revolutionary nationalist doctrine defining the state through Hindu civilizational identity, centralized authority, and national consolidation."
 revolutionary_monarchy:0 "Revolutionary Monarchy"
 revolutionary_monarchy_desc:0 "A fascist doctrine using militant mass politics and centralized mobilization to establish a radically transformed monarchical state."

 pan_hispanic_ultranationalism:0 "Pan-Hispanic Ultranationalism"
 pan_hispanic_ultranationalism_desc:0 "A national socialist doctrine demanding authoritarian unity among Hispanic peoples, territorial revision, and total state direction of society."
 strasserism:0 "Strasserism"
 strasserism_desc:0 "A national socialist doctrine combining racial ultranationalism and authoritarian rule with anti-capitalist economic rhetoric and mass mobilization."
 national_bolshevism:0 "National Bolshevism"
 national_bolshevism_desc:0 "A national socialist synthesis combining extreme nationalism, revolutionary state power, and total economic command."
 clerical_ultranationalism:0 "Clerical Ultranationalism"
 clerical_ultranationalism_desc:0 "A national socialist doctrine fusing exclusionary ultranationalism, total state authority, and militant clerical legitimacy."
 ultranationalist_orleanism:0 "Ultranationalist Orléanism"
 ultranationalist_orleanism_desc:0 "A national socialist doctrine joining Orléanist restoration with exclusionary nationalism, authoritarian mass politics, and territorial revanchism."
 integralism:0 "Integralism"
 integralism_desc:0 "A national socialist doctrine seeking an organic, hierarchical, corporatist nation under centralized authority and exclusionary national unity."
 pan_asian_ultranationalism:0 "Pan-Asian Ultranationalism"
 pan_asian_ultranationalism_desc:0 "A national socialist doctrine demanding authoritarian Asian unity, militarized national renewal, and expansion against foreign influence."


